name: quantize

# Redraws the plates in assets/ and the "Patches upstream" list from public
# GitHub data. Commits only when something actually changed.

on:
  schedule:
    - cron: '17 21 * * *' # 05:17 in Shanghai
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quantize
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      PROFILE_LOGIN: ${{ github.repository_owner }}
    steps:
      - name: Check out
        run: git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" .

      - name: Render
        run: node scripts/build.mjs

      - name: Commit if anything changed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "quantize: refresh plates"
            git push
          else
            echo "nothing changed"
          fi
